name: gated-train-pipeline

on:
  push:
    branches:
      - "**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run lightweight linter
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          ruff check . --select E9,F63,F7,F82

  train:
    runs-on: ubuntu-latest
    needs: lint
    if: ${{ needs.lint.result == 'success' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[run-train]') }}
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow scikit-learn

      - name: Train model
        run: |
          set -o pipefail
          if [ -z "$MLFLOW_TRACKING_URI" ]; then
            export MLFLOW_TRACKING_URI="sqlite:///mlflow.db"
          fi
          python train.py 2>&1 | tee train_output.log

      - name: Create error log file
        if: ${{ failure() }}
        run: |
          if [ -f train_output.log ]; then
            cp train_output.log error_logs.txt
          else
            echo "Training failed before logs were generated." > error_logs.txt
          fi

      - name: Upload error logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: train-error-logs
          path: error_logs.txt
          if-no-files-found: error

      - name: Final cleanup
        if: ${{ always() }}
        run: echo "Cleaning up temporary cloud volumes..."
