name: mlops-assignment-5

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_low_accuracy:
        description: "Set true to force a failing run (< 0.85)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow scikit-learn dvc

      - name: Pull data with DVC
        run: |
          dvc pull || echo "No DVC remote/data configured yet. Continuing with tiny built-in dataset."

      - name: Train model and log to MLflow
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          FORCE_LOW_ACCURACY: ${{ github.event.inputs.force_low_accuracy || 'false' }}
        run: |
          if [ -z "$MLFLOW_TRACKING_URI" ]; then
            export MLFLOW_TRACKING_URI="file:./mlruns"
          fi
          python train.py
          test -s model_info.txt

      - name: Upload model_info artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-info
          path: model_info.txt

  deploy:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow

      - name: Download model_info artifact
        uses: actions/download-artifact@v4
        with:
          name: model-info
          path: .

      - name: Validate accuracy threshold
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          ACCURACY_THRESHOLD: "0.85"
        run: |
          if [ -z "$MLFLOW_TRACKING_URI" ]; then
            export MLFLOW_TRACKING_URI="file:./mlruns"
          fi
          python check_threshold.py

      - name: Mock Docker build
        run: echo "Building Docker image for Run ID: $(cat model_info.txt)"
